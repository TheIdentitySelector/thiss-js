<div id="<%= tooltipId %>" class="tooltip" data-tooltip="<%= tooltipData %>">
    <div class="tooltip-content">
        <div id="<%= tooltipId %>-title" class="tooltip-title"><%= tooltipTitle %></div>
        <div id="<%= tooltipId %>-text" class="tooltip-description">
            <%= tooltipText %>
        </div>
    </div>
</div>
